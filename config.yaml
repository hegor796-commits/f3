# ============================================================
# Настройки ИИ-агента мониторинга B2B-Center
# ============================================================

source:
  # Страница со списком актуальных торгов B2B-Center
  market_url: "https://www.b2b-center.ru/market/"
  # Сколько страниц результатов просматривать по каждому слову
  pages: 1
  # Пауза между запросами, секунды (не душим сайт)
  request_delay: 2
  # ПРИМЕЧАНИЕ: слова поиска теперь живут в ШАБЛОНАХ внутри бота
  # (проектирование / строительство) и меняются кнопками в Telegram.
  # Начальные значения шаблонов заданы в b2b_agent/main.py (TEMPLATE_DEFS).

# Ключевые слова для первичного отбора (регистр не важен,
# ищется вхождение подстроки в названии/описании объявления).
# Достаточно совпадения ЛЮБОГО слова из списка.
keywords:
  - "проектирование"
  - "проектн"          # проектная/проектные (документация, работы)
  - "проектно-изыскательск"
  - "изыскани"         # инженерные изыскания
  - "рабочая документация"
  - "рабочей документации"
  - "ПИР"              # проектно-изыскательские работы
  - "обследование"
  - "конструкторск"    # конструкторская документация
  - "эскизн"           # эскизный проект
  - "генплан"
  - "разработка проекта"
  - "разработку проекта"

# Слова-исключения: если встретилось — объявление отбрасывается
exclude_keywords: []
  # - "аренда"

ai:
  # Включить оценку релевантности через OpenAI API
  # (нужен OPENAI_API_KEY в .env; если ключа нет — агент
  # автоматически работает в режиме "только ключевые слова")
  enabled: true
  model: "gpt-4o"
  # Опиши своими словами, что тебе действительно интересно.
  # ИИ отбрасывает формальные совпадения по словам, которые
  # на самом деле не подходят, и пишет краткое резюме.
  interest_profile: >
    Наша компания специализируется на проектировании: разработка
    проектной и рабочей документации, инженерные изыскания,
    проектно-изыскательские работы (ПИР), конструкторская документация,
    обследование зданий и сооружений, разработка проектов и генпланов.
    Интересуют тендеры, где нужно ВЫПОЛНИТЬ проектные/изыскательские
    работы. Не интересуют: простая поставка товаров и материалов без
    проектирования, строительно-монтажные работы без проектной части,
    аренда, охрана, клининг, поставка оборудования.
  # Минимальная оценка релевантности (0-10), чтобы отправить уведомление
  min_score: 6
  # Максимум ИИ-проверок за один цикл (ограничение расходов)
  max_checks_per_cycle: 20

telegram:
  # Токен бота и chat_id задаются в .env:
  # TELEGRAM_BOT_TOKEN и TELEGRAM_CHAT_ID
  parse_mode: "HTML"

schedule:
  # Интервал между циклами проверки в режиме `run`, минуты
  interval_minutes: 30

storage:
  # База данных с уже обработанными объявлениями
  db_path: "state.db"
